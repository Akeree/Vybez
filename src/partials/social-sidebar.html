<aside class="sidebar" id="app-drawer" aria-label="Vybez Social">
  <a class="brand" href="/social" aria-label="Vybez Social home">{{lockup:social}}</a>
  <nav aria-label="Vybez Social">
    <p class="nav-group-label">Hosting</p>
    <div class="nav-list">
      <a class="nav-item" href="/social" data-app="nights">{{icon:users}}<span>Your nights</span></a>
      <a class="nav-item" href="/social/new" data-app="plan">{{icon:calendar-plus}}<span>Plan a night</span></a>
      <a class="nav-item" href="/social/notifications" data-app="notifications">{{icon:bell}}<span class="grow">Notifications</span><span class="badge" data-unread hidden></span></a>
      <a class="nav-item" href="/social/settings" data-app="settings">{{icon:settings}}<span>Settings</span></a>
    </div>
  </nav>
  <div class="me" data-me>
    <span class="avatar" data-me-avatar>{{icon:user-round:18}}</span>
    <span class="stack grow" style="min-width:0"><span class="label ellipsis" data-me-name>Signed out</span><span class="caption t3 ellipsis" data-me-sub></span></span>
    <a class="icon-btn ghost" href="/social/settings" aria-label="Settings">{{icon:settings}}</a>
  </div>
</aside>

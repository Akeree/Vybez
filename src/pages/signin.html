<!--meta {"title":"Sign in","description":"Sign in to Vybez.","layout":"bare","page":"signin"}-->
<div class="auth">
  <div class="photo auth-photo">
    {{photo:rooftop:eager}}
    <div class="scrim"></div>
    <a class="over" href="/" aria-label="Vybez home" style="left:32px;top:32px;right:auto;bottom:auto">{{lockup}}</a>
    <div class="over"><p class="quote">Welcome back. The night’s waiting.</p></div>
  </div>
  <div class="auth-form">
    <form data-form="signin" novalidate>
      <div class="stack gap-8">
        <h1 class="h-page">Sign in to Vybez</h1>
        <p class="t2">Pick up where you left off.</p>
      </div>
      <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" placeholder="kemi@example.com" autocomplete="email" required></div>
      <div class="field"><div class="row between"><label for="password">Password</label><a class="link" href="/forgot" style="font-size:13px">Forgot it?</a></div><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="form-error" data-error role="alert" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      <p class="or">or</p>
      <div class="row gap-8">
        <button class="btn btn-outline grow" type="button" data-toast="Google sign-in isn’t switched on yet. Use email for now.">{{brand:google:18}}Google</button>
        <button class="btn btn-outline grow" type="button" data-toast="Apple sign-in isn’t switched on yet. Use email for now.">{{brand:apple:18}}Apple</button>
      </div>
      <p class="caption t3" style="text-align:center">New here? <a class="link" href="/signup" data-keep-next>Create an account</a></p>
    </form>
  </div>
</div>
